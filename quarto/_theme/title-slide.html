<section id="$idprefix$title-slide" class="princeton-title" data-state="is-title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <div class="title-block">
    <h1 class="title">$title$</h1>
$if(subtitle)$
    <p class="subtitle">$subtitle$</p>
$endif$
    <div class="title-rule"></div>
$for(author)$
    <p class="author">$author$</p>
$endfor$
$if(date)$
    <p class="date">$date$</p>
$endif$
  </div>
$if(title-graphic)$
  <img class="title-graphic" src="$title-graphic$" alt="">
$elseif(logo)$
  <img class="title-graphic" src="$logo$" alt="">
$endif$
</section>
